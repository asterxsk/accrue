name: Release

# Builds the release APK and publishes it as a GitHub release.
#   gh workflow run release.yml
# or push a tag:
#   git tag v2.1.0 && git push origin v2.1.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the Flutter the app is developed against; newer stable
          # channels deprecate `package:flutter/material.dart`.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; releases must be signed with the stable key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/accrue-release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/android/accrue-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Signing keystore written."

      - name: Read version from pubspec
        id: version
        run: |
          raw=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)
          if [[ ! "$raw" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::pubspec version must match MAJOR.MINOR.PATCH+BUILD; got '$raw'"
            exit 1
          fi
          echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "code=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "Parsed version ${BASH_REMATCH[1]} (versionCode ${BASH_REMATCH[2]})."

      - run: flutter pub get

      # A warning is a defect here, not a note: the release must not ship one.
      - run: flutter analyze --fatal-infos --fatal-warnings

      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      # The APK is the product. Refuse to publish one that Android cannot
      # parse, that carries another package or version, or that any key other
      # than the stable release key signed.
      - name: Verify APK
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.name }}
          EXPECTED_CODE: ${{ steps.version.outputs.code }}
          # SHA-256 of the release certificate, so a stray debug key fails.
          EXPECTED_CERT: 09fbb2aff8aa99cb7633bfe08180dea1f8364119e556b50252b127c7a11b80dc
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          unzip -tq "$apk" > /dev/null
          echo "Zip structure OK."

          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certs=$("$build_tools/apksigner" verify --print-certs "$apk")
          echo "$certs" | head -5
          echo "$certs" | grep -q "SHA-256 digest: $EXPECTED_CERT" || {
            echo "::error::APK is not signed with the release key."
            exit 1
          }
          # Both schemes must verify: v2 for Android 7+, v1 for installers that
          # still read the JAR signature. A v2-only APK is what makes a real
          # phone answer "There was a problem parsing the package".
          verify=$("$build_tools/apksigner" verify --min-sdk-version 23 -v "$apk")
          echo "$verify"
          echo "$verify" | grep -q "Verified using v1 scheme (JAR signing): true" || {
            echo "::error::APK has no v1 signature; older installers cannot parse it."
            exit 1
          }
          echo "$verify" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || {
            echo "::error::APK has no v2 signature."
            exit 1
          }

          "$build_tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          grep -q 'minSdkVersion(0x0101020c)=24' manifest.txt || {
            echo "::error::minSdk moved away from Android 7.0."
            exit 1
          }
          "$build_tools/aapt2" dump badging "$apk" > badging.txt
          grep -q "package: name='com.wrongturn.accrue'" badging.txt || {
            echo "::error::Unexpected package name."
            exit 1
          }
          grep -q "versionName='$EXPECTED_VERSION'" badging.txt || {
            echo "::error::APK versionName does not match pubspec ($EXPECTED_VERSION)."
            exit 1
          }
          grep -q "versionCode='$EXPECTED_CODE'" badging.txt || {
            echo "::error::APK versionCode does not match pubspec ($EXPECTED_CODE)."
            exit 1
          }
          "$build_tools/zipalign" -c -p 4 "$apk"
          echo "Package, version, minSdk, alignment and both signatures OK."

      - name: Name the artifact
        run: |
          mkdir -p dist
          apk="dist/accrue-${{ steps.version.outputs.name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" | awk '{ print $1 }' > "$apk.sha256"
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Accrue v${{ steps.version.outputs.name }}
          body: |
            Accrue ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}).

            Install `accrue-${{ steps.version.outputs.name }}.apk` on Android 7.0 or newer.
            The `.sha256` file beside it is the checksum of the download — a file that does not
            match is a truncated transfer, which Android reports as "problem parsing the package".
            Release builds are signed with the project's release key, so later versions install
            over this one without uninstalling. Builds published before v2.1.1 used a CI debug
            key and cannot update to this line — uninstall once, then updates are stable.
          files: |
            dist/accrue-${{ steps.version.outputs.name }}.apk
            dist/accrue-${{ steps.version.outputs.name }}.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
