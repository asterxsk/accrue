name: Release

# Builds the release APK and publishes it as a GitHub release.
#   gh workflow run release.yml
# or push a tag:
#   git tag v2.1.0 && git push origin v2.1.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the Flutter the app is developed against; newer stable
          # channels deprecate `package:flutter/material.dart`.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: version
        run: |
          raw=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: *//')
          echo "name=${raw%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${raw##*+}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/accrue-${{ steps.version.outputs.name }}.apk"
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Accrue v${{ steps.version.outputs.name }}
          body: |
            Accrue ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}).

            Install `accrue-${{ steps.version.outputs.name }}.apk` on Android 7.0 or newer.
            This build is signed with the CI runner's debug key: it installs cleanly, but a
            future release built on a different runner may require uninstalling first.
          files: dist/accrue-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
