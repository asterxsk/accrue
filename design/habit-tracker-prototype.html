<!doctype html>
<!--
  Habit Tracker — interactive prototype of PRD v1.0.
  Android handset shell from the bundled Open Design frame; app inside .phone-content.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Habit Tracker</title>
  <style>
    /* OD-LAYOUT-PRIMITIVES v1 */
    @layer od-layout {
      [hidden]:not([hidden="until-found" i]) { display: none !important; }
      dialog:not([open]) { display: none !important; }
      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
      .od-stack { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-field { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-field) > :where(*) { display: block; }
      .od-nowrap { white-space: nowrap; }
      .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
      .od-touch { min-width: 44px; min-height: 44px; }
    }
    :root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    /* ── Handset shell geometry ───────────────────────────────── */
    :root {
      --phone-screen-width: 412px;
      --phone-screen-height: 915px;
      --phone-bezel: 10px;
      --phone-outer-radius: 46px;
      --phone-screen-radius: 38px;
      --phone-safe-top: 52px;
      --phone-safe-bottom: 28px;
      --phone-system-fg: #f2f0e9;
      --phone-screen-bg: #121211;
      --phone-stage-bg: #0d0d0c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.07), transparent 36%),
        var(--phone-stage-bg);
      color: #1b1b19;
      font-family: var(--font-ui);
    }
    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 18%),
        linear-gradient(155deg, #414348 0%, #23252a 44%, #0c0d10 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.84),
        0 34px 72px -22px rgba(8,10,14,.56),
        0 11px 25px -10px rgba(8,10,14,.34);
      isolation: isolate;
    }
    .phone-frame::before, .phone-frame::after {
      content: ""; position: absolute; z-index: -1; top: 92px; bottom: 92px; width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.14) 18%, transparent 32%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }
    .hardware-button {
      position: absolute; right: -3px; width: 4px; border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2d3036 62%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.1);
    }
    .hardware-button.volume { top: 205px; height: 92px; }
    .hardware-button.power { top: 322px; height: 70px; background: linear-gradient(90deg, #08090b, #3c424c 62%, #08090b); }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }
    .phone-content {
      position: absolute; inset: 0;
      overflow-x: hidden; overflow-y: auto;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .punch-hole {
      position: absolute; z-index: 40; top: 14px; left: 50%;
      width: 14px; height: 14px; transform: translateX(-50%); border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #283343 0 10%, #090b0f 30%, #000 72%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), inset 0 0 3px #000;
      pointer-events: none;
    }
    .status-bar {
      position: absolute; z-index: 15; inset: 0 0 auto; height: var(--phone-safe-top);
      display: grid; grid-template-columns: minmax(0,1fr) 64px minmax(0,1fr);
      align-items: start; padding: 14px 19px 0;
      color: var(--phone-system-fg); pointer-events: none;
    }
    .status-time { justify-self: start; display: flex; align-items: center; height: 16px; font-size: 14px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
    .status-cutout-zone { width: 64px; }
    .status-icons { justify-self: end; display: inline-flex; align-items: center; height: 16px; gap: 5px; }
    .status-icons svg { display: block; flex: none; fill: currentColor; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .cellular { width: 14px; height: 12px; }
    .status-icons .battery { width: 9px; height: 14px; }
    .gesture-indicator {
      position: absolute; z-index: 40; left: 50%; bottom: 8px; width: 108px; height: 4px;
      transform: translateX(-50%); border-radius: 99px; background: var(--phone-system-fg);
      opacity: .86; pointer-events: none;
    }

    @media (max-height: 998px) { .phone-frame { zoom: .9; } }
    @media (max-height: 904px) { .phone-frame { zoom: .82; } }
    @media (max-height: 829px) { .phone-frame { zoom: .74; } }
    @media (max-height: 754px) { .phone-frame { zoom: .66; } }
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }

    /* ── Claude design system tokens ────────────────────────────
       Light parchment is the default; dark is a separately tuned set. */
    :root {
      --font-ui: "Anthropic Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --font-serif: "Anthropic Serif", Georgia, "Times New Roman", serif;

      --bg: #f5f4ed;
      --surface: #faf9f5;
      --surface-2: #e8e6dc;
      --line: #e8e6dc;
      --hairline: #f0eee6;
      --text: #141413;
      --muted: #5e5d59;
      --faint: #87867f;

      --accent: #c96442;
      --accent-ink: #a94e2e;
      --accent-on: #faf9f5;
      --accent-soft: rgba(201, 100, 66, .12);
      --warn: #9c6b23;
      --warn-ink: #8a5d1c;
      --danger: #9e3b31;
      --danger-on: #fbf6f2;

      --action-bg: #141413;
      --action-fg: #faf9f5;
      --action-hover: #2b2b28;

      --track: #e8e6dc;
      --scrim: rgba(20, 20, 19, .3);
      --shadow: rgba(0, 0, 0, .05) 0 4px 24px;
      --sheet-shadow: 0 -10px 40px rgba(35, 30, 20, .16);

      --focus: #3898ec;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --ease: cubic-bezier(.2, 0, 0, 1);

      --phone-system-fg: #17181a;
      --phone-screen-bg: #f5f4ed;
      --phone-stage-bg: #e8eaee;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #141413;
      --surface: #30302e;
      --surface-2: #3d3d3a;
      --line: #3d3d3a;
      --hairline: #30302e;
      --text: #faf9f5;
      --muted: #b0aea5;
      --faint: #a5a49c;

      --accent: #d97757;
      --accent-ink: #e89a7e;
      --accent-on: #141413;
      --accent-soft: rgba(217, 119, 87, .16);
      --warn: #e0a458;
      --warn-ink: #e6b271;
      --danger: #e58a7a;
      --danger-on: #141413;

      --action-bg: #faf9f5;
      --action-fg: #141413;
      --action-hover: #e8e6dc;

      --track: #3d3d3a;
      --scrim: rgba(0, 0, 0, .6);
      --shadow: 0 0 0 1px #3d3d3a;
      --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, .45);

      --focus: #8ab4d8;

      --phone-system-fg: #faf9f5;
      --phone-screen-bg: #141413;
      --phone-stage-bg: #0d0d0c;
      color-scheme: dark;
    }
    :root[data-theme="light"] body {
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.95), transparent 36%),
        var(--phone-stage-bg);
      color: var(--text);
    }
    :root[data-theme="dark"] body {
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.06), transparent 36%),
        var(--phone-stage-bg);
      color: var(--text);
    }

    body { font-family: var(--font-ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    .ic { display: block; inline-size: var(--ic, 20px); block-size: var(--ic, 20px); flex: none; }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding-bottom: 118px;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Headers ──────────────────────────────────────────────── */
    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 20px 0;
    }
    .eyebrow {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.4;
      color: var(--muted);
    }
    h1.title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 30px;
      line-height: 1.14;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .screen { padding: 0 20px; flex: 1 1 auto; display: flex; flex-direction: column; }
    .head-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      margin: 0 -8px 6px;
      padding: 0 0;
    }
    .back {
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border: 0; background: transparent; border-radius: 999px;
      color: var(--text); cursor: pointer;
    }
    .back .ic { --ic: 22px; }
    .back:hover { background: var(--surface-2); }
    .head-action {
      min-height: 44px; padding: 0 12px;
      border: 0; background: transparent; border-radius: var(--r-sm);
      font-size: 15px; font-weight: 500; color: var(--accent-ink);
      cursor: pointer;
    }
    .head-action:hover { background: var(--accent-soft); }
    .head-plus {
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border: 1px solid var(--line); background: var(--surface);
      border-radius: 999px; color: var(--text); cursor: pointer;
    }
    .head-plus .ic { --ic: 20px; }
    .head-plus:hover { border-color: var(--faint); }

    /* ── Today number ─────────────────────────────────────────── */
    .stat { padding: 22px 20px 0; }
    .stat-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .stat-num {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .stat-num .of { color: var(--muted); font-weight: 500; }
    .stat-pct { font-size: 20px; font-weight: 600; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
    .track { height: 6px; margin-top: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .track-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 260ms var(--ease); }

    /* ── Sections ─────────────────────────────────────────────── */
    .section { padding: 26px 20px 0; }
    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .habit-list { list-style: none; margin: 0; padding: 0; }
    .habit-item { border-bottom: 1px solid var(--line); }
    .habit-item:first-child { border-top: 1px solid var(--line); }
    .habit-row { display: flex; align-items: center; gap: 4px; min-height: 68px; }
    .habit-main {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px 10px 0;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      border-radius: var(--r-sm);
    }
    .habit-main:hover .habit-name { color: var(--accent-ink); }

    .ring { position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; }
    .ring svg.arc-svg { position: absolute; inset: 0; width: 44px; height: 44px; transform: rotate(-90deg); }
    .ring .arc-track { stroke: var(--line); }
    .ring .arc-fill { stroke: var(--accent); transition: stroke-dashoffset 260ms var(--ease); }
    .ring-icon { position: relative; width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); }
    .ring-icon .ic { --ic: 17px; }
    .habit-item.is-done .ring-icon { color: var(--accent-ink); }

    .habit-text { display: grid; gap: 2px; min-width: 0; }
    .habit-name {
      display: block;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .habit-sub {
      display: block;
      font-size: 13px;
      line-height: 1.35;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .habit-sub.is-warn { color: var(--warn-ink); }
    .habit-item.is-done .habit-name { color: var(--text); }

    .habit-tail { display: flex; align-items: center; gap: 2px; flex: none; }
    .row-more {
      width: 44px; height: 44px; flex: none;
      display: grid; place-items: center;
      border: 0; background: transparent; border-radius: 999px;
      color: var(--faint); cursor: pointer;
    }
    .row-more .ic { --ic: 18px; }
    .row-more:hover { background: var(--surface-2); color: var(--text); }
    .mini-step {
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      color: var(--text);
      cursor: pointer;
    }
    .mini-step .ic { --ic: 16px; }
    .mini-step:hover:not(:disabled) { border-color: var(--faint); background: var(--surface-2); }
    .mini-step:disabled { opacity: .38; cursor: default; }
    .count-value {
      min-width: 24px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .chev {
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border: 0; background: transparent; border-radius: 999px;
      color: var(--faint); cursor: pointer;
    }
    .chev .ic { --ic: 18px; }
    .chev:hover { color: var(--text); background: var(--surface-2); }

    .dashed-row {
      width: 100%;
      min-height: 52px;
      margin-top: 12px;
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px;
      border: 1px dashed var(--line);
      border-radius: var(--r-md);
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .dashed-row .ic { --ic: 16px; color: var(--accent-ink); }
    .dashed-row:hover { border-color: var(--faint); color: var(--text); }

    /* ── Cards ────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 12px; }

    .routine-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      margin-bottom: 10px;
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .routine-main {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0 10px 10px;
      border: 0;
      border-radius: var(--r-md);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .routine-main:hover .routine-name { color: var(--accent-ink); }
    .routine-disc {
      width: 44px; height: 44px; flex: none;
      display: grid; place-items: center;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .routine-text { display: grid; gap: 2px; min-width: 0; flex: 1 1 auto; }
    .routine-name { display: block; font-size: 15px; font-weight: 600; }
    .routine-meta { display: block; font-size: 13px; color: var(--muted); }
    .routine-state { display: block; font-size: 13px; color: var(--muted); }

    .routine-run-list { display: grid; gap: 8px; }
    .routine-run-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: 10px 14px;
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .routine-run-row.is-current { border-color: var(--accent); background: var(--accent-soft); }
    .routine-run-row.is-upcoming { opacity: .78; }
    .routine-check {
      width: 28px; height: 28px; flex: none;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--accent-on);
    }
    .routine-check .ic { --ic: 15px; }
    .routine-run-row.is-done .routine-check { background: var(--accent); border-color: var(--accent); }
    .routine-run-row.is-current .routine-check { border-color: var(--accent); }
    .routine-run-text { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
    .routine-run-name { font-size: 15px; font-weight: 600; }
    .routine-run-row.is-done .routine-run-name { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }
    .routine-run-meta { font-size: 12px; color: var(--muted); }
    .routine-run-value { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ── Counter detail ───────────────────────────────────────── */
    .counter-body { display: grid; justify-items: center; text-align: center; padding: 10px 0 0; }
    .disc {
      width: 64px; height: 64px;
      display: grid; place-items: center;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-ink);
    }
    .disc .ic { --ic: 28px; }
    .display-name { margin: 14px 0 2px; font-family: var(--font-serif); font-size: 28px; line-height: 1.2; font-weight: 500; letter-spacing: -0.01em; }
    .target-line { margin: 0; font-size: 14px; color: var(--muted); }
    .big-count {
      margin: 22px 0 0;
      font-size: 56px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .big-count .denom { font-size: 22px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: -0.01em; }
    .dot-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; row-gap: 6px; margin-top: 20px; max-width: 100%; }
    .dot {
      border-radius: 999px;
      background: var(--surface-2);
      border: 1.5px solid var(--line);
      flex: none;
    }
    .dot.is-on { background: var(--accent); border-color: var(--accent); }

    .stepper-row { display: flex; gap: 16px; justify-content: center; margin-top: 26px; }
    .big-step {
      width: 64px; height: 64px;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .big-step .ic { --ic: 24px; }
    .big-step:hover:not(:disabled) { border-color: var(--faint); background: var(--surface-2); }
    .big-step:disabled { opacity: .35; cursor: default; }

    .full-cards { width: 100%; margin-top: 28px; text-align: left; }
    .streak-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .streak-num { margin: 2px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .best { margin: 0; font-size: 13px; color: var(--muted); white-space: nowrap; }
    .week-card .week-dots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
    .week-dot { height: 24px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
    .week-dot.is-on { background: var(--accent); border-color: var(--accent); }
    .week-dot.is-today:not(.is-on) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .week-letters { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
    .week-letters span { font-size: 10px; text-align: center; color: var(--muted); letter-spacing: .04em; }

    /* ── Timer ────────────────────────────────────────────────── */
    .timer-body { display: grid; justify-items: center; text-align: center; padding-top: 18px; }
    .timer-name { margin: 0; font-family: var(--font-serif); font-size: 17px; font-weight: 500; color: var(--muted); }
    .timer-ring { position: relative; width: min(244px, 68vw); aspect-ratio: 1; margin: 22px 0 6px; }
    .timer-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-ring .track-c { stroke: var(--line); }
    .timer-ring .value-c { stroke: var(--accent); transition: stroke-dashoffset 400ms linear; }
    .timer-center { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 4px; }
    .timer-clock { font-size: 34px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .timer-of { font-size: 13px; color: var(--muted); }
    .timer-start {
      width: 72px; height: 72px;
      margin-top: 18px;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 0;
      background: var(--accent);
      color: var(--accent-on);
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .18);
    }
    .timer-start .ic { --ic: 26px; }
    .timer-start:active { transform: translateY(1px); }
    .timer-goal { width: 100%; margin-top: 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .timer-goal .label { margin: 0; font-size: 14px; color: var(--muted); }
    .timer-goal .value { margin: 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ghost-btn {
      margin-top: 16px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--accent-ink);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .ghost-btn:hover { background: var(--accent-soft); }
    .ghost-muted { color: var(--muted); }
    .ghost-muted:hover { background: var(--surface-2); color: var(--text); }

    /* ── Routine run ──────────────────────────────────────────── */
    .segments { display: flex; gap: 4px; margin: 4px 0 22px; }
    .segment { flex: 1 1 0; height: 4px; border-radius: 999px; background: var(--track); }
    .segment.is-done { background: var(--accent); }
    .segment.is-current { background: var(--accent-ink); opacity: .55; }
    .step-card { padding: 20px; }
    .step-eyebrow { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .step-name { margin: 0; font-family: var(--font-serif); font-size: 24px; line-height: 1.25; font-weight: 500; letter-spacing: -0.01em; overflow-wrap: anywhere; }
    .step-meta { margin: 6px 0 18px; font-size: 14px; color: var(--muted); }
    .btn-primary {
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: var(--r-md);
      background: var(--action-bg);
      color: var(--action-fg);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--action-hover); }
    .btn-primary:disabled { opacity: .45; cursor: default; }
    .btn-primary:active:not(:disabled) { transform: translateY(1px); }
    .btn-block { width: 100%; }
    .btn-secondary {
      min-height: 48px; padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 15px; font-weight: 500; cursor: pointer;
    }
    .btn-secondary:hover { border-color: var(--faint); background: var(--surface-2); }
    .btn-danger { background: var(--danger); color: var(--danger-on); }
    .btn-danger:hover { background: color-mix(in oklab, var(--danger), black 8%); }
    .next-up { margin-top: 24px; }
    .next-up-list { list-style: none; margin: 8px 0 0; padding: 0; }
    .next-up-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .next-up-list li:last-child { border-bottom: 0; }
    .next-up-list .mins { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .complete-card { text-align: center; padding: 26px 20px; }
    .complete-card h2 { margin: 0 0 4px; font-family: var(--font-serif); font-size: 24px; font-weight: 500; }
    .complete-card p { margin: 0; font-size: 14px; color: var(--muted); }
    .composer { display: grid; gap: 10px; margin-top: 14px; }
    .composer label, .field-label { font-size: 13px; font-weight: 500; color: var(--muted); }
    .field {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }
    .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ── Routines tab ─────────────────────────────────────────── */
    .routine-lg { padding: 16px; margin-bottom: 12px; }
    .routine-head { display: flex; align-items: center; gap: 4px; }
    .routine-lg-head { display: flex; align-items: center; gap: 14px; flex: 1 1 auto; min-width: 0; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; color: inherit; }
    .routine-lg-head:hover .routine-name { color: var(--accent-ink); }
    .step-list { list-style: none; margin: 14px 0 0; padding: 0; }
    .step-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
    .step-dot {
      width: 16px; height: 16px; flex: none;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: transparent;
      color: var(--accent-on);
    }
    .step-dot .ic { --ic: 10px; }
    .step-item.is-done .step-dot { background: var(--accent); border-color: var(--accent); }
    .step-item.is-current .step-dot { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--surface); background: transparent; }
    .step-item.is-done .step-name { color: var(--muted); }
    .step-item.is-current .step-name { font-weight: 600; }
    .step-item.is-upcoming .step-name { color: var(--muted); }
    .step-mins { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }

    /* ── Insights ─────────────────────────────────────────────── */
    .hero-card { padding: 20px; }
    .hero-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .big-stat { margin: 0; font-size: 52px; line-height: 1; font-weight: 500; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .big-stat .pct { font-size: 24px; font-weight: 500; color: var(--muted); margin-left: 2px; }
    .trend {
      display: inline-flex; align-items: center; gap: 4px;
      min-height: 30px; padding: 0 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-size: 13px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .trend .ic { --ic: 12px; }
    .trend.is-zero { background: var(--surface-2); color: var(--muted); }
    .card-caption { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

    .chart-wrap { margin-top: 14px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; }
    .axis { height: 150px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; padding-bottom: 1px; }
    .axis span { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .plot { height: 150px; display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; align-items: stretch; border-bottom: 1px solid var(--line); }
    .bar-slot { display: flex; flex-direction: column; justify-content: flex-end; }
    .bar { width: 100%; border-radius: 6px 6px 0 0; background: var(--faint); opacity: .45; }
    .bar.is-today { background: var(--accent); opacity: 1; }
    .bar.is-empty { background: transparent; }
    .day-letters { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; margin: 6px 0 0 38px; }
    .day-letters span { font-size: 11px; text-align: center; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .day-letters span.is-today { color: var(--text); font-weight: 600; }

    .streak-row { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .streak-row:last-child { border-bottom: 0; }
    .streak-row .val { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ── Profile ──────────────────────────────────────────────── */
    .profile-id { display: flex; align-items: center; gap: 14px; margin-top: 20px; padding: 16px; }
    .profile-disc {
      width: 52px; height: 52px; flex: none;
      display: grid; place-items: center;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-ink);
    }
    .profile-disc .ic { --ic: 24px; }
    .profile-text { display: grid; gap: 2px; min-width: 0; }
    .profile-name { margin: 0; font-family: var(--font-serif); font-size: 19px; font-weight: 500; line-height: 1.3; }
    .profile-sub { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }

    /* ── Profile settings ─────────────────────────────────────── */
    .group-label { margin: 26px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .setting-row {
      width: 100%;
      min-height: 56px;
      display: flex; align-items: center; gap: 12px;
      padding: 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      font-size: 15px;
    }
    .setting-row:first-of-type { border-top: 1px solid var(--line); }
    .setting-row:hover .setting-label { color: var(--accent-ink); }
    .setting-label { flex: 1 1 auto; }
    .setting-value { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .setting-row .chev { width: 24px; height: 24px; }
    .setting-row > .ic { --ic: 18px; color: var(--faint); }
    .switch {
      width: 48px; height: 28px; flex: none;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      position: relative;
      cursor: pointer;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease);
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px; border-radius: 999px;
      background: var(--muted);
      transition: transform 160ms var(--ease), background-color 160ms var(--ease);
    }
    .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--accent-on); }

    /* ── New habit ────────────────────────────────────────────── */
    .kind-options { display: grid; gap: 8px; margin-top: 10px; }
    .kind-option {
      display: flex; align-items: center; gap: 14px;
      min-height: 64px; padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      color: var(--text);
    }
    .kind-option:hover { border-color: var(--faint); }
    .kind-option[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
    .kind-icon { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
    .kind-option[aria-pressed="true"] .kind-icon { background: var(--surface); color: var(--accent-ink); }
    .kind-icon .ic { --ic: 18px; }
    .kind-text { display: grid; gap: 2px; min-width: 0; }
    .kind-name { display: block; font-size: 15px; font-weight: 600; }
    .kind-desc { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; }

    .target-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; padding: 12px 0; border-top: 1px solid var(--line); }
    .target-label { display: grid; gap: 2px; }
    .target-label .t { display: block; font-size: 15px; font-weight: 500; }
    .target-label .u { display: block; font-size: 13px; color: var(--muted); }
    .target-controls { display: flex; align-items: center; gap: 6px; }
    .target-value { min-width: 36px; text-align: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ── New habit page ───────────────────────────────────────── */
    .head-title {
      flex: 1 1 auto;
      margin: 0;
      text-align: center;
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.005em;
    }
    .head-spacer { width: 44px; flex: none; }

    .new-habit-screen { padding-bottom: 0; }
    .new-habit-body { padding-bottom: 6px; }
    .field-block { display: grid; gap: 8px; margin-top: 16px; }
    .field-block:first-child { margin-top: 2px; }
    .field-block .ob-link { margin-top: 2px; padding: 4px 0; }
    .field-hint { margin: 0; font-size: 12px; line-height: 1.5; color: var(--faint); }
    .icon-picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
    .icon-opt {
      aspect-ratio: 1;
      min-height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .icon-opt .ic { --ic: 20px; }
    .icon-opt:hover { border-color: var(--faint); color: var(--text); }
    .icon-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
    .danger-link { display: block; margin-top: 22px; padding: 8px 0; border: 0; background: transparent; color: var(--danger); font-size: 14px; font-weight: 600; cursor: pointer; }
    .new-habit-body .target-row { margin-top: 24px; }
    .new-habit-note { margin-top: 26px; padding-bottom: 4px; }
    .new-habit-foot {
      position: sticky;
      bottom: 0;
      margin: 28px -20px 0;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--line);
      background: color-mix(in oklab, var(--bg) 94%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .link-row {
      width: 100%; min-height: 56px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-top: 8px; padding: 0;
      border: 0; border-top: 1px solid var(--line);
      background: transparent; color: var(--text);
      font-size: 15px; text-align: left; cursor: pointer;
    }
    .link-row .val { color: var(--muted); font-size: 14px; }
    .link-row:hover .lbl { color: var(--accent-ink); }
    .note { margin: 10px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); }

    .screen-foot {
      position: sticky;
      bottom: 0;
      margin: auto -20px 0;
      padding: 14px 20px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0), var(--bg) 26%);
      display: grid;
      gap: 10px;
    }
    :root[data-theme="light"] .screen-foot { background: linear-gradient(to bottom, rgba(245,243,236,0), var(--bg) 26%); }

    /* ── Empty state ──────────────────────────────────────────── */
    .empty { padding: 60px 20px 0; text-align: left; }
    .empty-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      text-align: center;
      padding: 24px 28px calc(44px + var(--phone-safe-bottom, 0px));
      min-height: calc(var(--phone-screen-height, 915px) - var(--phone-safe-top, 52px) - var(--phone-safe-bottom, 28px) - 132px);
    }
    .empty-center h1 { max-width: 12ch; }
    .empty-center p { max-width: 32ch; margin-left: auto; margin-right: auto; }
    .empty-center .btn-primary { width: 100%; max-width: 240px; margin: 22px auto 0; }
    .empty-center .link-btn { align-self: center; margin-top: 10px; }
    .empty h1 { margin: 0 0 10px; font-family: var(--font-serif); font-size: 32px; line-height: 1.14; font-weight: 500; letter-spacing: -0.01em; }
    .empty p { margin: 0 0 24px; font-size: 15px; line-height: 1.55; color: var(--muted); max-width: 34ch; }
    .empty .btn-primary { width: 100%; }
    .link-btn {
      display: block; margin: 12px auto 0; padding: 8px 12px; min-height: 44px;
      border: 0; background: transparent; color: var(--muted);
      font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
      cursor: pointer; border-radius: var(--r-sm);
    }
    .link-btn:hover { color: var(--text); }

    /* ── Pill ─────────────────────────────────────────────────── */
    .pill {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: calc(var(--phone-safe-bottom) + 16px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      min-height: 68px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }
    .pill button {
      min-width: 68px;
      min-height: 56px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 3px;
      padding: 6px 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .01em;
      cursor: pointer;
    }
    .pill button .ic { --ic: 20px; }
    .pill button:hover { color: var(--text); }
    .pill button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
    .pill button:focus-visible { outline-offset: -1px; }

    /* ── Overlay: sheets and dialogs ──────────────────────────── */
    .overlay { position: absolute; inset: 0; z-index: 30; display: flex; }
    .overlay.is-dialog { align-items: center; justify-content: center; padding: 24px; }
    .overlay.is-dialog #overlaySlot { width: 100%; max-width: 340px; display: flex; justify-content: center; max-height: 100%; }
    .overlay.is-popup { align-items: flex-start; justify-content: flex-start; }
    .overlay.is-popup .scrim { background: transparent; }
    .overlay.is-popup #overlaySlot { position: absolute; inset: 0; pointer-events: none; }
    .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 150ms var(--ease); }
    .overlay.is-open .scrim { opacity: 1; }

    .popup-panel {
      position: absolute;
      pointer-events: auto;
      min-width: 184px;
      max-width: calc(100% - 16px);
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: 0 10px 30px rgba(20, 16, 8, .18);
      transform: scale(.94);
      opacity: 0;
      transition: transform 140ms var(--ease), opacity 140ms var(--ease);
    }
    .overlay.is-open .popup-panel { transform: none; opacity: 1; }
    .popup-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 0 12px;
      border: 0;
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--text);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }
    .popup-item .ic { --ic: 18px; color: var(--muted); }
    .popup-item > span { flex: 1 1 auto; min-width: 0; }
    .popup-item:hover { background: var(--surface-2); }
    .popup-item:focus-visible { outline-offset: -2px; }
    .popup-item.is-danger { color: var(--danger); }
    .popup-item.is-danger .ic { color: var(--danger); }

    .sheet-title { margin: 0 0 4px; font-family: var(--font-serif); font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
    .sheet-desc { margin: 0 0 16px; font-size: 14px; line-height: 1.55; color: var(--muted); }
    .choice-list { display: grid; gap: 6px; margin-top: 10px; }
    .choice {
      width: 100%; min-height: 52px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }
    .choice:hover { border-color: var(--faint); }
    .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .choice .ic { --ic: 16px; color: var(--accent-ink); }
    .choice > span { flex: 1 1 auto; min-width: 0; }
    .choice.is-danger { color: var(--danger); }
    .choice.is-danger .ic { color: var(--danger); }

    .dialog-panel {
      position: relative;
      width: 100%;

  var storageOk = (function () {

  /* ═══════════════ Derived data ═══════════════ */
  function byId(id) {

    return null;
  }
  function routineById(id) {

    return null;

  function bestStreakOf(h) {

  function fmtHM(seconds) {
    var total = Math.max(0, Math.floor(seconds));

    return m + "m";
  }
  function fmtMinutes(minutes) {
    var m = Math.max(0, Math.round(minutes));
    if (m >= 60) {

      return rem ? h + "h " + rem + "m" : h + "h";

    return m + "m";
  }
  function fmtClock(seconds) {
    var total = Math.max(0, Math.floor(seconds));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);

  function esc(str) {

  }

  /* ═══════════════ Rollover ═══════════════ */
  function commitRunningSeconds() {

  function rollover() {

    state.habits.forEach(function (h) { h.checked = false; h.count = 0; h.seconds = 0; });
    state.runningHabitId = null;
    state.timerStartedAt = null;
    state.timerBaseSeconds = 0;
    state.dayKey = currentKey;
    NOW = now;
    TODAY = startOfDay(now);
    TODAY_KEY = currentKey;
    persist();

  function liveSeconds(h) {

  /* ═══════════════ Navigation ═══════════════ */

  var scrollPositions = { today: 0, insights: 0, routines: 0, profile: 0 };
  var TOP_LEVEL = { today: 1, insights: 1, routines: 1, profile: 1 };
  var historyDepth = 0;
  var suppressPop = false;

  function currentScreen() { return stack[stack.length - 1]; }
  function go(name, params) {

  }
  function goBack() {

  /* ═══════════════ Screen builders ═══════════════ */

  function routineCardHTML(r, compact) {

  function insightsHTML() {
    if (!state.habits.length) {
      return '<div class="top"><div><p class="eyebrow">' + eyebrowDate(TODAY) + '</p><h1 class="title">Insights</h1></div></div>' +
        '<div class="empty empty-center"><p class="eyebrow">No data yet</p><h1>Nothing to chart yet</h1>' +
        '<p>Once you record a few days, this page will show the week back as a percentage, seven bars and the streaks still running.</p>' +
        '<button type="button" class="btn-primary btn-block" data-action="new-habit">Create a habit</button></div>';
    }

    var week = weekDays(TODAY);
    var elapsed = Math.min(7, diffDays(week[0], TODAY) + 1);
    var totalHabits = state.habits.length;
    var weekDone = 0;
    week.forEach(function (d, i) {
      if (i >= elapsed) return;
      var key = dateKey(d);
      state.habits.forEach(function (h) { if (doneOn(key, h.id)) weekDone += 1; });

    var weekPct = Math.round(weekDone / (totalHabits * elapsed) * 100);

    var prevStart = addDays(week[0], -7);
    var prevDone = 0;
    for (var i = 0; i < elapsed; i += 1) {
      var pKey = dateKey(addDays(prevStart, i));
      state.habits.forEach(function (h) { if (doneOn(pKey, h.id)) prevDone += 1; });
    }
    var prevPct = Math.round(prevDone / (totalHabits * elapsed) * 100);
    var trend = weekPct - prevPct;

    var trendIcon = trend > 0 ? "up" : trend < 0 ? "down" : "flat";
    var trendText = (trend > 0 ? "+" : "") + trend + "%";

    var bars = week.map(function (d, idx) {
      var key = dateKey(d);
      var isFuture = diffDays(TODAY, d) > 0;
      var dayDone = 0;
      state.habits.forEach(function (h) { if (doneOn(key, h.id)) dayDone += 1; });
      var pctDay = isFuture ? 0 : Math.round(dayDone / totalHabits * 100);
      var hPx = isFuture || pctDay === 0 ? 0 : Math.max(4, Math.round(pctDay / 100 * 150));
      return '<div class="bar-slot">' +
        '<div class="bar' + (key === TODAY_KEY ? " is-today" : "") + (hPx === 0 ? " is-empty" : "") + '" style="height:' + hPx + 'px"></div>' +
      '</div>';
    }).join("");

    var letters = week.map(function (d) {
      return '<span class="' + (dateKey(d) === TODAY_KEY ? "is-today" : "") + '">' + letterFor(d) + '</span>';
    }).join("");

    var streaks = state.habits.map(function (h) { return { h: h, n: streakOf(h) }; })
      .filter(function (item) { return item.n > 0; })
      .sort(function (a, b) { return b.n - a.n; });

    var streakRows = streaks.length
      ? streaks.map(function (item) {
          return '<div class="streak-row"><span>' + esc(item.h.name) + '</span><span class="val">' + item.n + ' ' + (item.n === 1 ? "day" : "days") + '</span></div>';
        }).join("")
      : '<p class="note">No running streaks right now. A streak starts the first day you complete a habit.</p>';

    return '<div class="top">' +
        '<div><p class="eyebrow">' + shortDate(week[0]) + ' – ' + shortDate(week[6]) + '</p><h1 class="title">Insights</h1></div>' +
        '<button type="button" class="head-action" data-action="share-stats">Share</button>' +
      '</div>' +
      '<section class="section">' +
        '<div class="card hero-card">' +
          '<div class="hero-row">' +
            '<p class="big-stat">' + weekPct + '<span class="pct">%</span></p>' +
            '<span class="trend' + (trend === 0 ? " is-zero" : "") + '">' + ico(trendIcon) + '<span>' + trendText + '</span></span>' +
          '</div>' +
          '<p class="card-caption">completion this week</p>' +
        '</div>' +
        '<div class="card">' +
          '<h2 class="section-title" style="margin-bottom:14px">Daily completion</h2>' +
          '<div class="chart-wrap">' +
            '<div class="axis"><span>100</span><span>50</span><span>0</span></div>' +
            '<div class="plot">' + bars + '</div>' +
          '</div>' +
          '<div class="day-letters">' + letters + '</div>' +
        '</div>' +
        '<div class="card">' +
          '<h2 class="section-title" style="margin-bottom:6px">Streaks</h2>' +
          streakRows +
        '</div>' +
      '</section>';
  }

  function routinesHTML() {
    return '<div class="top">' +
        '<div><p class="eyebrow">Step by step</p><h1 class="title">Routines</h1></div>' +
        '<button type="button" class="head-plus" data-action="new-routine" aria-label="New routine">' + ico("plus") + '</button>' +
      '</div>' +
      '<section class="section">' +
        (state.routines.length
          ? state.routines.map(function (r) { return routineCardHTML(r, false); }).join("")
          : '<div class="card"><h2 class="section-title" style="margin-bottom:6px">No routines yet</h2>' +
            '<p class="note">A routine is a set of your habits that you run together — morning, evening — one after another.</p></div>') +
        '<button type="button" class="dashed-row" data-action="new-routine">' + ico("plus") + 'New routine</button>' +
      '</section>';
  }

  function dotSize(target) {
    var inner = 340;
    var gap = 6;
    while (gap > 4 && (inner - (target - 1) * gap) / target < 16) gap -= 1;
    var size = Math.floor((inner - (target - 1) * gap) / target);
    return { size: Math.max(10, Math.min(26, size)), gap: gap };
  }

  function counterHTML(id) {
    var h = byId(id);
    if (!h) return todayHTML();
    var pct = Math.round(ratio(h) * 100);
    var ds = dotSize(h.target);
    var dots = "";
    for (var i = 0; i < h.target; i += 1) {
      dots += '<span class="dot' + (i < h.count ? " is-on" : "") + '" style="width:' + ds.size + 'px;height:' + ds.size + 'px;margin-right:' + (i < h.target - 1 ? ds.gap : 0) + 'px"></span>';
    }
    var week = weekDays(TODAY);
    var weekDots = week.map(function (d) {
      var key = dateKey(d);
      var on = doneOn(key, h.id);
      return '<span class="week-dot' + (on ? " is-on" : "") + (key === TODAY_KEY ? " is-today" : "") + '"></span>';
    }).join("");
    var letters = week.map(function (d) { return '<span>' + letterFor(d) + '</span>'; }).join("");
    var current = streakOf(h);
    var best = bestStreakOf(h);

    return '<div class="screen">' +
      '<div class="head-bar">' +
        '<button type="button" class="back" data-action="back" aria-label="Back">' + ico("back") + '</button>' +
        '<button type="button" class="head-action" data-action="rename-habit" data-id="' + h.id + '">Edit</button>' +
      '</div>' +
      '<div class="counter-body">' +
        '<div class="disc">' + ico(h.icon) + '</div>' +
        '<h1 class="display-name">' + esc(h.name) + '</h1>' +
        '<p class="target-line">' + h.target + ' ' + esc(unitWord(h)) + ' a day</p>' +
        '<p class="big-count">' + h.count + '<span class="denom">/ ' + h.target + '</span></p>' +
        '<div class="dot-row" role="img" aria-label="' + h.count + ' of ' + h.target + ' marked">' + dots + '</div>' +
        '<div class="stepper-row">' +
          '<button type="button" class="big-step" data-action="counter-dec" data-id="' + h.id + '" aria-label="One less"' + (h.count <= 0 ? " disabled" : "") + '>' + ico("minus") + '</button>' +
          '<button type="button" class="big-step" data-action="counter-inc" data-id="' + h.id + '" aria-label="One more"' + (h.count >= h.target ? " disabled" : "") + '>' + ico("plus") + '</button>' +
        '</div>' +
        '<div class="full-cards">' +
          '<div class="card streak-card">' +
            '<div><p class="eyebrow">Current streak</p><p class="streak-num">' + current + ' ' + (current === 1 ? "day" : "days") + '</p></div>' +
            '<p class="best">Best ' + best + ' ' + (best === 1 ? "day" : "days") + '</p>' +
          '</div>' +
          '<div class="card week-card">' +
            '<p class="eyebrow" style="margin-bottom:0">This week</p>' +
            '<div class="week-dots">' + weekDots + '</div>' +
            '<div class="week-letters">' + letters + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function unitWord(h) {
    if (h.kind === "count") return h.unit && h.unit !== "times" ? h.unit : (h.target === 1 ? "time" : "times");
    if (h.kind === "timer") return "minutes";
    return "time";
  }

  function timerHTML(id) {
    var h = byId(id);
    if (!h) return todayHTML();
    var secs = liveSeconds(h);
    var goal = h.target * 60;
    var p = Math.min(1, secs / goal);
    var r = 46;
    var c = 2 * Math.PI * r;
    var offset = c * (1 - p);
    var running = isRunning(h);

    return '<div class="screen">' +
      '<div class="head-bar">' +
        '<button type="button" class="back" data-action="back" aria-label="Back">' + ico("back") + '</button>' +
        '<button type="button" class="head-action" data-action="timer-end" data-id="' + h.id + '">End</button>' +
      '</div>' +
      '<div class="timer-body">' +
        '<p class="timer-name">' + esc(h.name) + '</p>' +
        '<div class="timer-ring" id="timerRing" role="img" aria-label="Elapsed ' + fmtHM(secs) + ' of ' + fmtMinutes(h.target) + '">' +
          '<svg viewBox="0 0 100 100" aria-hidden="true">' +
            '<circle class="track-c" cx="50" cy="50" r="' + r + '" fill="none" stroke-width="3"/>' +
            '<circle class="value-c" id="timerArc" cx="50" cy="50" r="' + r + '" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"/>' +
          '</svg>' +
          '<div class="timer-center">' +
            '<span class="timer-clock" id="timerClock">' + fmtClock(secs) + '</span>' +
            '<span class="timer-of">of ' + fmtMinutes(h.target) + '</span>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="timer-start" id="timerToggle" data-action="timer-toggle" data-id="' + h.id + '" aria-label="' + (running ? "Pause" : "Start") + '">' +
          ico(running ? "pause" : "play") +
        '</button>' +
        '<div class="card timer-goal">' +
          '<p class="label">Today\'s goal</p>' +
          '<p class="value" id="timerLogged">' + fmtHM(secs) + ' logged</p>' +
        '</div>' +
        '<button type="button" class="ghost-btn" data-action="timer-add30" data-id="' + h.id + '">Add 30 minutes</button>' +
      '</div>' +
    '</div>';
  }

  function routineRunHTML(id) {
    var r = routineById(id);
    if (!r) return routinesHTML();
    var habits = routineHabits(r);
    var total = habits.length;
    var done = habits.filter(isDone).length;
    var currentId = null;
    for (var i = 0; i < total; i += 1) {
      if (!isDone(habits[i])) { currentId = habits[i].id; break; }
    }

    var segments = habits.map(function (h) {
      var cls = isDone(h) ? "is-done" : (h.id === currentId ? "is-current" : "");
      return '<span class="segment ' + cls + '"></span>';
    }).join("");

    var body = "";
    if (!total) {
      body = '<div class="card step-card">' +
          '<p class="step-eyebrow">Empty routine</p>' +
          '<h2 class="step-name">Made of habits</h2>' +
          '<p class="step-meta">A routine is a set of your habits in order. Add a few and they will line up here.</p>' +
          '<button type="button" class="btn-primary btn-block" data-action="edit-routine" data-id="' + r.id + '">Add habits</button>' +
        '</div>';
    } else if (done >= total) {
      body = '<div class="card complete-card">' +
          '<h2>Routine complete</h2>' +
          '<p>' + esc(r.name) + ' is done for today.</p>' +
        '</div>';
    } else {
      var rows = habits.map(function (h) {
        var habitDone = isDone(h);
        var cls = habitDone ? "is-done" : (h.id === currentId ? "is-current" : "is-upcoming");
        return '<button type="button" class="routine-run-row ' + cls + '" data-action="routine-habit-toggle" data-id="' + h.id + '" aria-pressed="' + (habitDone ? "true" : "false") + '">' +
          '<span class="routine-check" aria-hidden="true">' + (habitDone ? ico("check") : "") + '</span>' +
          '<span class="routine-run-text">' +
            '<span class="routine-run-name">' + esc(h.name) + '</span>' +
            '<span class="routine-run-meta">' + esc(habitTypeLine(h)) + '</span>' +
          '</span>' +
          '<span class="routine-run-value">' + habitShortValue(h) + '</span>' +
        '</button>';
      }).join("");
      body = '<p class="step-eyebrow" style="margin:14px 4px 8px">' + done + ' of ' + total + ' done · next: ' + esc((habits.filter(function (h) { return !isDone(h); })[0] || habits[0]).name) + '</p>' +
        '<div class="routine-run-list">' + rows + '</div>';
    }

    var ghost = "";
    if (done > 0) {
      ghost = '<button type="button" class="ghost-btn ghost-muted" data-action="routine-reset" data-id="' + r.id + '">Reset today</button>';
    }

    return '<div class="screen">' +
      '<div class="head-bar">' +
        '<button type="button" class="back" data-action="back" aria-label="Back">' + ico("back") + '</button>' +
        '<span class="eyebrow" style="margin:0">' + esc(r.name) + '</span>' +
        '<button type="button" class="head-action" data-action="edit-routine" data-id="' + r.id + '">Edit</button>' +
      '</div>' +
      '<div class="segments" aria-hidden="true">' + segments + '</div>' +
      body +
      '<div style="text-align:center">' + ghost + '</div>' +
    '</div>';
  }

  /* ═══════════════ Onboarding ═══════════════ */
  var ob = { name: "", photo: "", step: 0, habits: {}, routines: {} };

  function obReset() {
    ob.name = "";
    ob.photo = "";
    ob.step = 0;
    ob.habits = {};
    ob.routines = {};
    STARTER_HABITS.forEach(function (h) { ob.habits[h.key] = true; });
    STARTER_ROUTINES.forEach(function (r) { ob.routines[r.key] = true; });
  }
  obReset();

  var photoTarget = "profile";
  var photoInput = document.createElement("input");
  photoInput.type = "file";
  photoInput.accept = "image/*";
  photoInput.style.display = "none";
  document.body.appendChild(photoInput);

  function applyPhoto(url) {
    if (photoTarget === "onboarding") {
      ob.photo = url;
      render(false);
      return;
    }
    state.profile.photo = url;
    persist();
    if (modalOpen && overlaySlot.querySelector("#profileNameInput")) editProfileDialog();
    else render(false);
  }

  photoInput.addEventListener("change", function () {
    var file = photoInput.files && photoInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var side = Math.min(img.width, img.height);
          var canvas = document.createElement("canvas");
          canvas.width = 192;
          canvas.height = 192;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 192, 192);
          applyPhoto(canvas.toDataURL("image/jpeg", 0.82));
        } catch (err) {
          applyPhoto(reader.result);
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  function avatarHTML(size, photo, name, cls) {
    if (photo) return '<span class="' + cls + '"><img src="' + photo + '" alt="" /></span>';
    if (name) return '<span class="' + cls + '" aria-hidden="true">' + esc(name.trim().charAt(0).toUpperCase()) + '</span>';
    return '<span class="' + cls + '" aria-hidden="true">' + ico("person") + '</span>';
  }

  function onboardingHTML() {
    var step = ob.step;
    var dots = [0, 1, 2].map(function (i) {
      return '<span class="ob-dot' + (i === step ? " is-on" : "") + '"></span>';
    }).join("");
    var body = "";

    if (step === 0) {
      body =
        '<p class="eyebrow">Welcome</p>' +
        '<h1>Let’s make this yours.</h1>' +
        '<p class="ob-lead">A name and a photo make the app personal. Everything stays on this device.</p>' +
        '<div class="photo-well">' +
          avatarHTML(72, ob.photo, ob.name, "photo-disc") +
          '<div class="photo-actions">' +
            '<button type="button" class="photo-btn" data-action="ob-photo">' + (ob.photo ? "Change photo" : "Add a photo") + '</button>' +
            (ob.photo ? '<button type="button" class="photo-btn photo-remove" data-action="ob-photo-remove">Remove photo</button>' : "") +
          '</div>' +
        '</div>' +
        '<label class="field-label" for="obName">Your name</label>' +
        '<input class="field" id="obName" type="text" maxlength="40" autocomplete="given-name" placeholder="Alex" value="' + esc(ob.name) + '" style="margin-top:6px" data-autofocus />' +
        '<div class="ob-foot"><button type="button" class="btn-primary" data-action="ob-next"' + (ob.name.trim() ? "" : " disabled") + '>Continue</button></div>';
    } else if (step === 1) {
      var habitCards = STARTER_HABITS.map(function (h) {
        var on = !!ob.habits[h.key];
        return '<button type="button" class="rec-card" data-action="ob-toggle" data-group="habits" data-key="' + h.key + '" aria-pressed="' + (on ? "true" : "false") + '">' +
          '<span class="rec-icon">' + ico(h.icon) + '</span>' +
          '<span class="rec-text"><span class="rec-name">' + esc(h.name) + '</span><span class="rec-meta">' + esc(h.meta) + '</span></span>' +
          '<span class="rec-check">' + ico("check") + '</span>' +
        '</button>';
      }).join("");
      var own = state.habits.map(function (h) {
        return '<div class="rec-card" aria-pressed="true">' +
          '<span class="rec-icon">' + ico(h.icon) + '</span>' +
          '<span class="rec-text"><span class="rec-name">' + esc(h.name) + '</span><span class="rec-meta">Added by you</span></span>' +
          '<span class="rec-check">' + ico("check") + '</span>' +
        '</div>';
      }).join("");
      body =
        '<p class="eyebrow">Habits · 1 of 2</p>' +
        '<h1>Start with a few</h1>' +
        '<p class="ob-lead">Common habits to begin with. Pick what you want now — you can change everything later.</p>' +
        '<div class="rec-list">' + habitCards + own + '</div>' +
        '<button type="button" class="ob-link" data-action="new-habit">' + '+ Add your own habit</button>' +
        '<button type="button" class="ob-link" data-action="habit-ideas" style="margin-top:2px">Browse habit ideas</button>' +
        '<div class="ob-foot">' +
          '<button type="button" class="btn-secondary" data-action="ob-back">Back</button>' +
          '<button type="button" class="btn-primary" data-action="ob-next">Continue</button>' +
        '</div>';
    } else {
      var routineCards = STARTER_ROUTINES.map(function (r) {
        var on = !!ob.routines[r.key];
        var names = r.habitKeys.map(function (k) {
          var idea = STARTER_HABITS.filter(function (h) { return h.key === k; })[0];
          return idea ? idea.name : k;
        });
        return '<button type="button" class="rec-card" data-action="ob-toggle" data-group="routines" data-key="' + r.key + '" aria-pressed="' + (on ? "true" : "false") + '">' +
          '<span class="rec-icon">' + ico("layers") + '</span>' +
          '<span class="rec-text"><span class="rec-name">' + esc(r.name) + '</span><span class="rec-meta">' + esc(names.join(" · ")) + '</span></span>' +
          '<span class="rec-check">' + ico("check") + '</span>' +
        '</button>';
      }).join("");
      body =
        '<p class="eyebrow">Routines · 2 of 2</p>' +
        '<h1>Then a routine</h1>' +
        '<p class="ob-lead">A routine is a set of habits you run together, one after another. Skip these to build your own later.</p>' +
        '<div class="rec-list">' + routineCards + '</div>' +
        '<div class="ob-foot">' +
          '<button type="button" class="btn-secondary" data-action="ob-back">Back</button>' +
          '<button type="button" class="btn-primary" data-action="ob-finish">Finish setup</button>' +
        '</div>';
    }

    return '<div class="ob">' +
      '<div class="ob-head"><span class="eyebrow" style="margin:0">Habit Tracker</span><span class="ob-dots" aria-hidden="true">' + dots + '</span></div>' +
      '<div class="ob-step">' + body + '</div>' +
    '</div>';
  }

  function finishOnboarding() {
    var name = ob.name.replace(/\s+/g, " ").trim();
    if (!name) { ob.step = 0; render(true); return; }
    var created = {};
    STARTER_HABITS.forEach(function (h) {
      if (!ob.habits[h.key]) return;
      var habit = {
        id: "h-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
        name: h.name,
        kind: h.kind,
        icon: h.icon,
        target: h.target,
        unit: h.unit,
        checked: false,
        count: 0,
        seconds: 0
      };
      state.habits.push(habit);
      created[h.key] = habit.id;
    });
    STARTER_ROUTINES.forEach(function (r) {
      if (!ob.routines[r.key]) return;
      var ids = r.habitKeys.map(function (k) { return created[k]; }).filter(Boolean);
      if (!ids.length) return;
      state.routines.push({
        id: "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
        name: r.name,
        habitIds: ids
      });
    });
    state.profile = { name: name, photo: ob.photo, onboarded: true };
    persist();
    obReset();
    stack = [{ name: "today" }];
    render(true);
  }

  /* ═══════════════ Habit page — new and edit ═══════════════ */
  var HABIT_ICONS = ["check", "water", "walk", "book", "timer", "home", "person", "chart", "layers", "up"];

  function defaultIcon(kind) {
    return kind === "count" ? "water" : kind === "timer" ? "timer" : "check";
  }

  function blankHabit() {
    return { editId: null, name: "", kind: "check", target: 1, icon: "check", unit: "" };
  }

  function habitFormHTML() {
    var ui = pendingHabit;
    var editing = !!ui.editId;
    var kinds = [
      { value: "check", name: "Check off", desc: "One tap when it's done", icon: "check" },
      { value: "timer", name: "Timer", desc: "Track minutes spent", icon: "timer" },
      { value: "count", name: "Count", desc: "Track units toward a target", icon: "water" }
    ];
    var options = kinds.map(function (k) {
      return '<button type="button" class="kind-option" data-action="kind-select" data-kind="' + k.value + '" aria-pressed="' + (ui.kind === k.value ? "true" : "false") + '">' +
        '<span class="kind-icon">' + ico(k.icon) + '</span>' +
        '<span class="kind-text"><span class="kind-name">' + k.name + '</span><span class="kind-desc">' + k.desc + '</span></span>' +
      '</button>';
    }).join("");

    var selectedIcon = ui.icon || defaultIcon(ui.kind);
    var iconPicker = HABIT_ICONS.map(function (name) {
      return '<button type="button" class="icon-opt" data-action="icon-select" data-icon-name="' + name + '" aria-pressed="' + (selectedIcon === name ? "true" : "false") + '" aria-label="' + name + ' icon">' + ico(name) + '</button>';
    }).join("");

    var targetSection = "";
    if (ui.kind !== "check") {
      var unit = ui.kind === "timer" ? "minutes" : (ui.unit.trim() || (ui.target === 1 ? "time" : "times"));
      targetSection = '<div class="target-row">' +
          '<span class="target-label"><span class="t">Daily target</span><span class="u">' + esc(unit) + ' per day</span></span>' +
          '<span class="target-controls">' +
            '<button type="button" class="mini-step" data-action="target-dec" aria-label="Lower target"' + (ui.target <= 1 ? " disabled" : "") + '>' + ico("minus") + '</button>' +
            '<span class="target-value">' + ui.target + '</span>' +

  function saveHabitEdits() {
    var h = byId(pendingHabit.editId);
    if (!h) { pendingHabit = blankHabit(); if (stack.length > 1) goBack(); return; }
    var name = pendingHabit.name.replace(/\s+/g, " ").trim();
    if (!name) return;
    var kind = pendingHabit.kind;
    var kindChanged = h.kind !== kind;
    h.name = name;
    h.kind = kind;
    h.icon = pendingHabit.icon || defaultIcon(kind);
    h.target = kind === "check" ? 1 : Math.max(1, Math.min(240, pendingHabit.target));
    h.unit = kind === "count" ? (pendingHabit.unit.trim() || "times") : kind === "timer" ? "min" : "";
    if (kindChanged) { h.count = 0; h.seconds = 0; h.checked = false; if (state.runningHabitId === h.id) { state.runningHabitId = null; state.timerStartedAt = null; state.timerBaseSeconds = 0; } }
    if (h.count > h.target) h.count = h.target;
    pendingHabit = blankHabit();
    persist();
    var prev = stack.length > 1 ? stack[stack.length - 2] : null;
    var wasOnDetail = prev && (prev.name === "counter" || prev.name === "timer") && prev.id === h.id;
    if (wasOnDetail && kindChanged) { switchTab("today"); return; }
    if (stack.length > 1) goBack(); else render(true);
  }

    if (exists) return;
    state.habits.push({
      id: "h-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
      name: idea.name,
      kind: idea.kind,
      icon: idea.icon,

      unit: idea.unit,

  /* ═══════════════ Share ═══════════════ */
  function shareModel() {
    var week = weekDays(TODAY);
    var elapsed = Math.min(7, diffDays(week[0], TODAY) + 1);
    var total = state.habits.length;
    var weekDone = 0;
    var bars = week.map(function (d, i) {
      var key = dateKey(d);
      var dayDone = 0;
      state.habits.forEach(function (h) { if (doneOn(key, h.id)) dayDone += 1; });
      if (i < elapsed) weekDone += dayDone;
      return {
        letter: letterFor(d),
        pct: i >= elapsed ? 0 : Math.round(dayDone / (total || 1) * 100),
        today: key === TODAY_KEY
      };
    });
    var weekPct = total ? Math.round(weekDone / (total * elapsed) * 100) : 0;
    var prevStart = addDays(week[0], -7);
    var prevDone = 0;
    for (var p = 0; p < elapsed; p += 1) {
      var pKey = dateKey(addDays(prevStart, p));
      state.habits.forEach(function (h) { if (doneOn(pKey, h.id)) prevDone += 1; });
    }
    var prevPct = total ? Math.round(prevDone / (total * elapsed) * 100) : 0;
    var best = 0;
    state.habits.forEach(function (h) { best = Math.max(best, streakOf(h)); });
    var streaks = state.habits.map(function (h) { return { name: h.name, days: streakOf(h) }; })
      .filter(function (s) { return s.days > 0; })
      .sort(function (a, b) { return b.days - a.days; })
      .slice(0, 3);
    var name = state.profile.name || "You";
    return {
      name: name,
      initial: name.trim().charAt(0).toUpperCase(),
      photo: state.profile.photo,
      range: shortDate(week[0]) + " – " + shortDate(week[6]),
      weekPct: weekPct,
      trend: weekPct - prevPct,
      todayDone: doneCount(),
      todayTotal: total,
      best: best,
      habitCount: total,
      routineCount: state.routines.length,
      bars: bars,
      streaks: streaks
    };
  }

  var sharePhotoImg = null;

  function canvasText(ctx, text, x, y, font, color, align) {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = align || "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(text, x, y);
  }

  function canvasRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSharePoster(model, photoImg) {
    var canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1350;
    var ctx = canvas.getContext("2d");
    var dark = rootEl.getAttribute("data-theme") === "dark";
    var pal = dark
      ? { bg: "#141413", surface: "#30302e", line: "#3d3d3a", text: "#faf9f5", muted: "#b0aea5", faint: "#a5a49c", accent: "#d97757", soft: "rgba(217,119,87,.18)" }
      : { bg: "#f5f4ed", surface: "#faf9f5", line: "#e8e6dc", text: "#141413", muted: "#5e5d59", faint: "#87867f", accent: "#c96442", soft: "rgba(201,100,66,.12)" };
    var serif = function (size) { return '500 ' + size + 'px Georgia, "Times New Roman", serif'; };
    var sans = function (size, weight) { return (weight || 600) + ' ' + size + 'px -apple-system, "Segoe UI", Roboto, Arial, sans-serif'; };
    var M = 72;
    var right = 1008;

    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, 1080, 1350);

    /* Brand strip */
    ctx.beginPath();
    ctx.arc(M + 7, 86, 7, 0, Math.PI * 2);
    ctx.fillStyle = pal.accent;
    ctx.fill();
    canvasText(ctx, "HABIT TRACKER", M + 26, 94, sans(24), pal.text);
    canvasText(ctx, model.range, right, 94, sans(24, 500), pal.muted, "right");
    ctx.strokeStyle = pal.line;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(M, 124); ctx.lineTo(right, 124); ctx.stroke();

    /* Identity */
    var ax = M + 48, ay = 200;
    ctx.save();
    ctx.beginPath();
    ctx.arc(ax, ay, 48, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    if (photoImg) {
      ctx.drawImage(photoImg, ax - 48, ay - 48, 96, 96);
    } else {
      ctx.fillStyle = pal.soft;
      ctx.fillRect(ax - 48, ay - 48, 96, 96);
      canvasText(ctx, model.initial, ax, ay + 18, serif(44), pal.accent, "center");
    }
    ctx.restore();
    canvasText(ctx, model.name, M + 120, 208, serif(46), pal.text);
    canvasText(ctx, "This week", M + 120, 246, sans(24, 500), pal.muted);

    /* Hero */
    var heroFont = serif(168);
    ctx.font = heroFont;
    var heroWidth = ctx.measureText(String(model.weekPct)).width;
    canvasText(ctx, String(model.weekPct), M, 452, heroFont, pal.text);
    canvasText(ctx, "%", M + heroWidth + 8, 452, serif(96), pal.muted);
    var pillX = M + heroWidth + 96;
    var trendText = (model.trend > 0 ? "+" : "") + model.trend + "%";
    ctx.font = sans(26);
    var pillW = ctx.measureText(trendText).width + 48;
    canvasRoundRect(ctx, pillX, 396, pillW, 52, 26);
    ctx.fillStyle = model.trend === 0 ? pal.line : pal.soft;
    ctx.fill();
    canvasText(ctx, trendText, pillX + pillW / 2, 430, sans(26), model.trend === 0 ? pal.muted : pal.accent, "center");
    canvasText(ctx, "of habits completed this week", M, 506, sans(28, 500), pal.muted);

    /* Stat tiles */
    var tiles = [
      { k: "TODAY", v: model.todayDone + "/" + model.todayTotal },
      { k: "BEST STREAK", v: model.best + " d" },
      { k: "HABITS", v: String(model.habitCount) },
      { k: "ROUTINES", v: String(model.routineCount) }
    ];
    var tileW = 456, tileH = 136, gap = 24;
    tiles.forEach(function (tile, i) {
      var x = M + (i % 2) * (tileW + gap);
      var y = 552 + Math.floor(i / 2) * (tileH + gap);
      canvasRoundRect(ctx, x, y, tileW, tileH, 20);
      ctx.fillStyle = pal.surface;
      ctx.fill();
      ctx.strokeStyle = pal.line;
      ctx.lineWidth = 2;
      ctx.stroke();
      canvasText(ctx, tile.k, x + 24, y + 40, sans(20), pal.muted);
      canvasText(ctx, tile.v, x + 24, y + 106, serif(52), pal.text);
    });

    /* Seven day chart */
    var barW = 76, barGap = 56, barMax = 130;
    var startX = (1080 - (barW * 7 + barGap * 6)) / 2;
    var baseline = 1060;
    model.bars.forEach(function (b, i) {
      var x = startX + i * (barW + barGap);
      ctx.fillStyle = pal.line;
      canvasRoundRect(ctx, x, baseline - barMax, barW, barMax, 12);
      ctx.fill();
      var h = Math.max(6, Math.round(b.pct / 100 * barMax));
      ctx.fillStyle = b.today ? pal.accent : pal.muted;
      ctx.globalAlpha = b.today ? 1 : 0.42;
      canvasRoundRect(ctx, x, baseline - h, barW, h, 12);
      ctx.fill();
      ctx.globalAlpha = 1;
      canvasText(ctx, b.pct + "%", x + barW / 2, baseline - h - 16, sans(22, 500), b.today ? pal.accent : pal.muted, "center");
      canvasText(ctx, b.letter, x + barW / 2, baseline + 38, sans(24), b.today ? pal.text : pal.muted, "center");
    });

    /* Streaks */
    if (model.streaks.length) {
      model.streaks.forEach(function (s, i) {
        var y = 1166 + i * 44;
        canvasText(ctx, s.name, M, y, sans(26, 500), pal.text);
        canvasText(ctx, s.days + (s.days === 1 ? " day" : " days"), right, y, sans(26, 600), pal.accent, "right");
        ctx.strokeStyle = pal.line;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(M, y + 18); ctx.lineTo(right, y + 18); ctx.stroke();
      });
    } else {
      canvasText(ctx, "No streaks yet — a fresh start.", M, 1190, sans(26, 500), pal.muted);
    }

    /* Footer */
    ctx.strokeStyle = pal.line;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(M, 1282); ctx.lineTo(right, 1282); ctx.stroke();
    canvasText(ctx, "Made on this device · nothing leaves it", M, 1322, sans(22, 500), pal.faint);
    canvasText(ctx, "HABIT TRACKER", right, 1322, sans(22, 600), pal.faint, "right");

    return canvas;
  }

  function sharePoster() {
    var model = shareModel();
    if (!model.photo) { withPhoto(null); return; }
    if (sharePhotoImg && sharePhotoSrc === model.photo) { withPhoto(sharePhotoImg); return; }
    var img = new Image();
    img.onload = function () { withPhoto(img); };
    img.onerror = function () { withPhoto(null); };
    img.src = model.photo;
    function withPhoto(photoImg) {
      try {
        drawSharePoster(model, photoImg).toBlob(function (blob) {
          if (!blob) return;
          var file = new File([blob], "habit-stats.png", { type: "image/png" });
          if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "My habits", text: shareText() }).catch(function () { /* dismissed */ });
            return;
          }
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = "habit-stats.png";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
        }, "image/png");
      } catch (err) { /* ignore */ }
    }
    if (!model.photo) { withPhoto(null); return; }
    var img = new Image();
    img.onload = function () { withPhoto(img); };
    img.onerror = function () { withPhoto(null); };
    img.src = model.photo;
  }

  function shareText() {
    var model = shareModel();
    return model.name + " on Habit Tracker — " + model.todayDone + " of " + model.todayTotal + " habits today, " + model.weekPct + "% this week, best streak " + model.best + (model.best === 1 ? " day." : " days.");
  }
