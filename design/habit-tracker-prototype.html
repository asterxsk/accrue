      '<p class="group-label">Data</p>' +
      '<button type="button" class="setting-row" data-action="data-sheet"><span class="setting-label">Data &amp; export</span>' + ico("chevron") + '</button>' +
      '<p class="group-label">About</p>' +
      '<button type="button" class="setting-row" data-action="about"><span class="setting-label">About</span><span class="setting-value">v1.0</span>' + ico("chevron") + '</button>' +
      '<button type="button" class="setting-row" data-action="edit-profile"><span class="setting-label">Edit name &amp; photo</span>' + ico("chevron") + '</button>' +
    '</div>';
  }

  /* ═══════════════ Modal plumbing ═══════════════ */
  var modalOpen = false;
  var modalCtx = null;
  var lastTrigger = null;
  var closeTimer = null;
  var activeAnchor = null;

  function positionPopup() {
    var panel = overlaySlot.querySelector(".popup-panel");
    if (!panel || !activeAnchor || !document.body.contains(activeAnchor)) return;
    var box = overlay.getBoundingClientRect();
    var r = activeAnchor.getBoundingClientRect();
    var pad = 8;
    var topSafe = 54;
    var bottomLimit = pill.hidden ? 24 : 96;
    var pw = panel.offsetWidth;
    var ph = panel.offsetHeight;
    var left = r.right - box.left - pw;
    left = Math.max(pad, Math.min(left, box.width - pw - pad));
    var below = r.bottom - box.top + 6;
    var above = r.top - box.top - ph - 6;
    var flipped = false;
    if (below + ph > box.height - bottomLimit && above > topSafe) { flipped = true; }
    var top = flipped ? above : below;
    top = Math.max(topSafe, Math.min(top, box.height - ph - bottomLimit));
    panel.style.left = Math.round(left) + "px";
    panel.style.top = Math.round(top) + "px";
    panel.style.transformOrigin = (flipped ? "bottom" : "top") + " right";
  }

  function popupMenu(items, anchor) {
    var html = '<div class="popup-panel" role="menu" aria-label="Options">' +
      items.map(function (item) {
        return '<button type="button" class="popup-item' + (item.danger ? " is-danger" : "") + '" role="menuitem"' +
          (item.id ? ' data-id="' + item.id + '"' : "") +
          ' data-action="' + item.action + '">' +
          ico(item.icon) + '<span>' + esc(item.label) + '</span></button>';
      }).join("") +
    '</div>';
    openModal(html, { kind: "popup", anchor: anchor, trigger: anchor });
  }

  function openModal(html, opts) {
    opts = opts || {};
    if (closeTimer) { window.clearTimeout(closeTimer); closeTimer = null; }
    overlaySlot.innerHTML = html;
    paintIcons(overlaySlot);
    overlay.hidden = false;
    overlay.classList.remove("is-dialog", "is-popup");
    overlay.classList.add(opts.kind === "popup" ? "is-popup" : "is-dialog");
    modalOpen = true;
    modalCtx = opts.ctx || null;
    lastTrigger = opts.trigger || document.activeElement;
    activeAnchor = opts.kind === "popup" ? (opts.anchor || lastTrigger) : null;
    if (activeAnchor) positionPopup();
    void overlay.offsetWidth;
    overlay.classList.add("is-open");
    pushHistory();
    phoneContent.inert = true;
    pill.inert = true;
    document.addEventListener("keydown", modalKeys, true);
    window.requestAnimationFrame(function () {
      if (activeAnchor) positionPopup();
      var focusEl = overlaySlot.querySelector("[data-autofocus], input, .popup-item, button");
      if (focusEl) focusEl.focus();
    });
  }

  function closeModal(after, fromPop) {
    if (!modalOpen) return;
    modalOpen = false;
    activeAnchor = null;
    overlay.classList.remove("is-open");
    if (!fromPop) dropHistory();
    phoneContent.inert = false;
    pill.inert = false;
    document.removeEventListener("keydown", modalKeys, true);
    var trigger = lastTrigger;
    var finish = function () {
      overlay.hidden = true;
      overlaySlot.innerHTML = "";
      if (typeof after === "function") after();
      else if (trigger && document.body.contains(trigger)) trigger.focus();
    };
    if (reduceMotion.matches) finish();
    else closeTimer = window.setTimeout(finish, 170);
  }

  function modalKeys(e) {
    if (!modalOpen) return;
    if (e.key === "Escape") { e.preventDefault(); closeModal(); return; }
    if (overlay.classList.contains("is-popup") && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      var items = Array.prototype.slice.call(overlaySlot.querySelectorAll(".popup-item"));
      if (!items.length) return;
      var at = items.indexOf(document.activeElement);
      var step = e.key === "ArrowDown" ? 1 : -1;
      var nextIdx = at < 0 ? (step > 0 ? 0 : items.length - 1) : (at + step + items.length) % items.length;
      items[nextIdx].focus();
      return;
    }
    if (e.key !== "Tab") return;
    var nodes = overlaySlot.querySelectorAll("button, input, [href]");
    var focusables = Array.prototype.filter.call(nodes, function (el) {
      return !el.disabled && el.offsetParent !== null;
    });
    if (!focusables.length) return;
    var first = focusables[0];
    var last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function dialogShell(title, bodyHTML) {
    return '<div class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">' +
      '<h2 id="dlgTitle">' + esc(title) + '</h2>' +
      bodyHTML +
    '</div>';
  }

  function dialog(title, bodyHTML, actionsHTML) {
    return dialogShell(title,
      '<p>' + bodyHTML + '</p>' +
      '<div class="dialog-actions">' + actionsHTML + '</div>');
  }

  function confirmDialog(title, body, confirmLabel, onYes, tone, trigger) {
    var toneClass = tone === "primary" ? "btn-primary" : "btn-danger";
    openModal(dialog(title, body,
      '<button type="button" class="btn-secondary" data-action="modal-close">Cancel</button>' +
      '<button type="button" class="' + toneClass + '" data-action="modal-confirm">' + esc(confirmLabel) + '</button>'), {
      kind: "dialog",
      ctx: { onYes: onYes },
      trigger: trigger
    });
  }

  function infoDialog(title, body) {
    openModal(dialog(title, body,
      '<button type="button" class="btn-secondary" data-action="modal-close">Close</button>'), { kind: "dialog" });
  }

  function choiceDialog(title, options, selected, onPick) {
    var rows = options.map(function (opt, i) {
      return '<button type="button" class="choice" data-action="modal-choice" data-index="' + i + '" aria-pressed="' + (opt === selected ? "true" : "false") + '">' +
        '<span>' + esc(opt) + '</span>' + (opt === selected ? ico("check") : "") +
      '</button>';
    }).join("");
    openModal(dialogShell(title,
      '<div class="modal-body"><div class="choice-list">' + rows + '</div></div>' +
      '<div class="dialog-actions"><button type="button" class="btn-secondary" data-action="modal-close">Cancel</button></div>'), {
      kind: "dialog",
      ctx: { options: options, onPick: onPick }
    });

  function nameDialog(title, desc, value, buttonLabel, onSave, opts) {

      '<div class="modal-body">' +
        '<p class="sheet-desc">' + esc(desc) + '</p>' +
        '<label class="field-label" for="nameSheetInput">Name</label>' +
        '<input class="field" id="nameSheetInput" type="text" maxlength="60" autocomplete="off" value="' + esc(value) + '" style="margin-top:6px" data-autofocus />' +
        (opts.hint ? '<p class="modal-note">' + esc(opts.hint) + '</p>' : "") +
      '</div>' +
      '<div class="dialog-actions">' +
        '<button type="button" class="btn-secondary" data-action="modal-close">Cancel</button>' +
        '<button type="button" class="btn-primary" data-action="modal-save" id="nameSave">' + esc(buttonLabel) + '</button>' +
      '</div>'), {
      kind: "dialog",
      ctx: { onSave: onSave }
    });
    var input = overlaySlot.querySelector("#nameSheetInput");
    var saveBtn = overlaySlot.querySelector("#nameSave");
    var sync = function () { saveBtn.disabled = input.value.trim() === ""; };
    input.addEventListener("input", sync);
    sync();
  }

          '</div>' +

            '<button type="button" class="mini-step" data-action="time-step" data-unit="minute" data-delta="-5" aria-label="Minutes down">' + ico("minus") + '</button>' +
            '<span class="time-lbl">Minute</span>' +

      kind: "dialog",

    });

  function dataDialog() {
    openModal(dialogShell("Data & export",
      '<div class="modal-body">' +
        '<p class="sheet-desc">Everything lives on this device. Choose how much to clear.</p>' +

          '<button type="button" class="choice" data-action="clear-all">Clear habits &amp; history</button>' +

      '</div>' +
      '<div class="dialog-actions"><button type="button" class="btn-secondary" data-action="modal-close">Cancel</button></div>'), { kind: "dialog" });

  function editProfileDialog() {
    openModal(dialogShell("Edit profile",
      '<div class="modal-body">' +
        '<div class="photo-well">' +
          avatarHTML(64, state.profile.photo, state.profile.name, "photo-disc") +
          '<div class="photo-actions">' +
            '<button type="button" class="photo-btn" data-action="pick-photo" data-target="profile">' + (state.profile.photo ? "Change photo" : "Add a photo") + '</button>' +
            (state.profile.photo ? '<button type="button" class="photo-btn photo-remove" data-action="remove-photo" data-target="profile">Remove photo</button>' : "") +
          '</div>' +
        '</div>' +
        '<label class="field-label" for="profileNameInput">Your name</label>' +
        '<input class="field" id="profileNameInput" type="text" maxlength="40" autocomplete="given-name" value="' + esc(state.profile.name) + '" style="margin-top:6px" data-autofocus />' +
      '</div>' +
      '<div class="dialog-actions">' +
        '<button type="button" class="btn-secondary" data-action="modal-close">Cancel</button>' +
        '<button type="button" class="btn-primary" data-action="profile-save">Save</button>' +
      '</div>'), { kind: "dialog" });
  }

  /* ═══════════════ Timer ticking ═══════════════ */
  var ticker = null;
  var tickCount = 0;

  function startTickerIfNeeded() {
    if (state.runningHabitId && !ticker) {
      ticker = window.setInterval(onTick, 1000);
    } else if (!state.runningHabitId && ticker) {
      window.clearInterval(ticker);
      ticker = null;
    }
  }

  function onTick() {
    if (!state.runningHabitId) { startTickerIfNeeded(); return; }
    var h = byId(state.runningHabitId);
    if (!h) { state.runningHabitId = null; state.timerStartedAt = null; startTickerIfNeeded(); return; }
    var secs = liveSeconds(h);
    tickCount += 1;

    if (currentScreen().name === "timer" && currentScreen().id === h.id) {
      var clock = document.getElementById("timerClock");
      var arc = document.getElementById("timerArc");
      var logged = document.getElementById("timerLogged");
      var ring = document.getElementById("timerRing");
      if (clock) clock.textContent = fmtClock(secs);
      if (logged) logged.textContent = fmtHM(secs) + " logged";
      if (arc) {
        var r = 46, c = 2 * Math.PI * r;
        var p = Math.min(1, secs / (h.target * 60));
        arc.setAttribute("stroke-dashoffset", (c * (1 - p)).toFixed(1));
      }
      if (ring) ring.setAttribute("aria-label", "Elapsed " + fmtHM(secs) + " of " + fmtMinutes(h.target));
    }

    if (tickCount % 10 === 0) {
      h.seconds = Math.min(86400, Math.floor(secs));
      persist();
    }
  }

  /* ═══════════════ Actions ═══════════════ */
  function toggleTimer(h) {
    if (isRunning(h)) {
      h.seconds = Math.min(86400, Math.floor(liveSeconds(h)));
      state.runningHabitId = null;
      state.timerStartedAt = null;
      state.timerBaseSeconds = 0;
    } else {
      if (state.runningHabitId) {
        var prev = byId(state.runningHabitId);
        if (prev) prev.seconds = Math.min(86400, Math.floor(liveSeconds(prev)));
      }
      state.runningHabitId = h.id;
      state.timerBaseSeconds = h.seconds;
      state.timerStartedAt = Date.now();
    }
    persist();
    startTickerIfNeeded();
    render(true);
  }

  function setCount(h, next) {
    h.count = Math.max(0, Math.min(h.target, next));
    persist();
    render(true);
  }

  function addSeconds(h, delta) {
    var base = isRunning(h) ? liveSeconds(h) : h.seconds;
    var next = Math.max(0, Math.min(86400, base + delta));
    if (isRunning(h)) {
      state.timerBaseSeconds = next;
      state.timerStartedAt = Date.now();
    }
    h.seconds = Math.floor(next);
    persist();
    render(true);
  }

  function createHabit() {
    if (pendingHabit.editId) { saveHabitEdits(); return; }
    var name = pendingHabit.name.replace(/\s+/g, " ").trim();
    if (!name) return;
    var kind = pendingHabit.kind;
    var habit = {
      id: "h-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 5),
      name: name,
      kind: kind,
      icon: pendingHabit.icon || defaultIcon(kind),
      target: kind === "check" ? 1 : pendingHabit.target,
      unit: kind === "count" ? (pendingHabit.unit.trim() || "times") : kind === "timer" ? "min" : "",
      checked: false,
      count: 0,
      seconds: 0
    };
    state.habits.push(habit);
    pendingHabit = blankHabit();
    persist();
    if (modalOpen) closeModal();
    if (stack.length > 1) goBack();
    else render(true);
  }

  /* ═══════════════ Routine dialog ═══════════════ */
  var pendingRoutine = { id: null, name: "", habitIds: [] };

  function routineDialogBody() {
    var habits = state.habits;
    var rows = habits.map(function (h) {
      var on = pendingRoutine.habitIds.indexOf(h.id) !== -1;
      return '<button type="button" class="rec-card" data-action="routine-pick" data-id="' + h.id + '" aria-pressed="' + (on ? "true" : "false") + '">' +
        '<span class="rec-icon">' + ico(h.icon) + '</span>' +
        '<span class="rec-text"><span class="rec-name">' + esc(h.name) + '</span><span class="rec-meta">' + esc(habitTypeLine(h)) + '</span></span>' +
        '<span class="rec-check">' + ico("check") + '</span>' +
      '</button>';
    }).join("");
    var canSave = pendingRoutine.name.trim() !== "" && pendingRoutine.habitIds.length > 0;
    return '<div class="modal-body">' +
        '<label class="field-label" for="routineNameInput">Name</label>' +
        '<input class="field" id="routineNameInput" type="text" maxlength="60" autocomplete="off" placeholder="Morning" value="' + esc(pendingRoutine.name) + '" style="margin-top:6px" data-autofocus />' +
        '<h2 class="section-title" style="margin:20px 0 2px">Habits in this routine</h2>' +
        '<p class="modal-note" style="margin-bottom:10px">Pick them in the order you want to run them.</p>' +
        (habits.length
          ? '<div class="rec-list">' + rows + '</div>'
          : '<p class="modal-note">No habits yet. Create a habit first — a routine is made of habits.</p>') +
      '</div>' +
      '<div class="dialog-actions">' +
        '<button type="button" class="btn-secondary" data-action="modal-close">Cancel</button>' +
        '<button type="button" class="btn-primary" data-action="routine-save"' + (canSave ? "" : " disabled") + '>' + (pendingRoutine.id ? "Save routine" : "Create routine") + '</button>' +
      '</div>';
  }

  function refreshRoutineDialog() {
    if (!modalOpen) return;
    overlaySlot.innerHTML = dialogShell(pendingRoutine.id ? "Edit routine" : "New routine", routineDialogBody());
    paintIcons(overlaySlot);
  }

  function openRoutineDialog(r) {
    pendingRoutine = r
      ? { id: r.id, name: r.name, habitIds: r.habitIds.slice() }
      : { id: null, name: "", habitIds: [] };
    openModal(dialogShell(pendingRoutine.id ? "Edit routine" : "New routine", routineDialogBody()), { kind: "dialog" });
  }

  function focusControl(action, index) {
    var btns = app.querySelectorAll('[data-action="' + action + '"]');
    if (!btns.length) return;
    var target = btns[Math.max(0, Math.min(index, btns.length - 1))];
    if (target) target.focus();
  }

  function deleteHabit(h) {
    var index = state.habits.indexOf(h);
    state.habits = state.habits.filter(function (x) { return x.id !== h.id; });
    Object.keys(state.history).forEach(function (key) {
      var ids = state.history[key];
      if (!Array.isArray(ids)) return;
      var kept = ids.filter(function (hid) { return hid !== h.id; });
      if (kept.length) state.history[key] = kept;
      else delete state.history[key];
    });
    if (state.runningHabitId === h.id) {
      state.runningHabitId = null;
      state.timerStartedAt = null;
      state.timerBaseSeconds = 0;
      startTickerIfNeeded();
    }
    var screen = currentScreen();
    var onItsScreen = (screen.name === "counter" || screen.name === "timer") && screen.id === h.id;
    state.routines.forEach(function (r) {
      r.habitIds = r.habitIds.filter(function (id) { return id !== h.id; });
    });
    persist();
    if (onItsScreen) {
      stack = [{ name: "today" }];
      render(true);
      var tab = pill.querySelector('[data-tab="today"]');
      if (tab) tab.focus();
      return;
    }
    render(false);
    if (state.habits.length) focusControl("habit-menu", index > state.habits.length - 1 ? state.habits.length - 1 : index);
    else {
      var add = app.querySelector('[data-action="new-habit"]');
      if (add) add.focus();
    }
  }

  function deleteRoutine(r) {
    var index = state.routines.indexOf(r);
    state.routines = state.routines.filter(function (x) { return x.id !== r.id; });
    var screen = currentScreen();
    var onItsScreen = screen.name === "routine-run" && screen.id === r.id;
    persist();
    if (onItsScreen) {
      stack = [{ name: "routines" }];
      render(true);
      var tab = pill.querySelector('[data-tab="routines"]');
      if (tab) tab.focus();
      return;
    }
    render(false);
    if (state.routines.length) focusControl("routine-menu", index > state.routines.length - 1 ? state.routines.length - 1 : index);
    else {
      var add = app.querySelector('[data-action="new-routine"]');
      if (add) add.focus();
    }
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el) return;
    var action = el.dataset.action;
    var id = el.dataset.id;

    rollover();

    switch (action) {
      case "tab":
        rememberScroll();
        switchTab(el.dataset.tab);
        break;
      case "back":
        rememberScroll();
        goBack();
        break;
      case "settings":
        switchTab("profile");
        break;
      case "new-habit":
        openNewHabit();
        break;
      case "habit-ideas":
        openIdeasDialog();
        break;
      case "idea-add":
        addIdeaHabit(el.dataset.key);
        break;
      case "ideas-done":
        closeModal();
        break;
      case "toggle-check": {
        var h = byId(id);
        if (!h) break;
        h.checked = !h.checked;
        persist();
        render(false);
        break;
      }
      case "count-inc":
      case "count-dec": {
        var hc = byId(id);
        if (!hc) break;
        setCount(hc, hc.count + (action === "count-inc" ? 1 : -1));
        break;
      }
      case "open-counter":
        go("counter", { id: id });
        break;
      case "open-timer":
        go("timer", { id: id });
        break;
      case "counter-inc":
      case "counter-dec": {
        var hd = byId(id);
        if (!hd) break;
        setCount(hd, hd.count + (action === "counter-inc" ? 1 : -1));
        break;
      }
      case "habit-menu": {
        var hm = byId(id);
        if (!hm) break;
        var hmAnchor = app.querySelector('[data-action="habit-menu"][data-id="' + hm.id + '"]');
        popupMenu([
          { label: "Edit habit", action: "rename-habit", id: hm.id, icon: "pencil" },
          { label: "Delete habit", action: "delete-habit", id: hm.id, icon: "trash", danger: true }
        ], hmAnchor);
        break;
      }
      case "delete-habit": {
        var hx = byId(id);
        if (!hx) break;
        var hxOpener = app.querySelector('[data-action="habit-menu"][data-id="' + hx.id + '"]');
        closeModal(function () {
          confirmDialog("Delete " + hx.name + "?",
            "The habit and every day it was recorded are removed from this device. Streaks and Insights recalculate. This cannot be undone.",
            "Delete habit", function () { deleteHabit(hx); }, "danger", hxOpener);
        });
        break;
      }
      case "routine-menu": {
        var rm = routineById(id);
        if (!rm) break;
        var rmAnchor = app.querySelector('[data-action="routine-menu"][data-id="' + rm.id + '"]');
        popupMenu([
          { label: "Open routine", action: "open-routine", id: rm.id, icon: "layers" },
          { label: "Edit habits", action: "edit-routine", id: rm.id, icon: "pencil" },
          { label: "Delete routine", action: "delete-routine", id: rm.id, icon: "trash", danger: true }
        ], rmAnchor);
        break;
      }
      case "delete-routine": {
        var rx = routineById(id);
        if (!rx) break;
        var rxOpener = app.querySelector('[data-action="routine-menu"][data-id="' + rx.id + '"]');
        closeModal(function () {
          confirmDialog("Delete " + rx.name + "?",
            "The routine, its steps and today's progress are removed from this device. This cannot be undone.",
            "Delete routine", function () { deleteRoutine(rx); }, "danger", rxOpener);
        });
        break;
      }
      case "rename-habit": {
        var hr = byId(id);
        if (!hr) break;
        if (modalOpen) closeModal(function () { openEditHabit(hr); });
        else openEditHabit(hr);
        break;
      }
      case "delete-habit-page": {
        var hp = byId(pendingHabit.editId);
        if (!hp) break;
        confirmDialog("Delete " + hp.name + "?",
          "The habit and every day it was recorded are removed from this device. Streaks and Insights recalculate. This cannot be undone.",
          "Delete habit", function () {
            deleteHabit(hp);
            pendingHabit = blankHabit();
            if (currentScreen().name === "habit-new") goBack();
          }, "danger");
        break;
      }
      case "timer-toggle": {
        var ht = byId(id);
        if (ht) toggleTimer(ht);
        break;
      }
      case "timer-end": {
        var he = byId(id);
        if (he && isRunning(he)) toggleTimer(he);
        else if (he) { he.seconds = Math.min(86400, Math.floor(he.seconds)); persist(); }
        goBack();
        break;
      }
      case "timer-add30": {
        var ha = byId(id);
        if (ha) addSeconds(ha, 1800);
        break;
      }
      case "open-routine":
        if (modalOpen) closeModal(function () { go("routine-run", { id: id }); });
        else go("routine-run", { id: id });
        break;
      case "routine-habit-toggle": {
        var rh = byId(id);
        if (!rh) break;
        setHabitDone(rh, !isDone(rh));
        persist();
        render(false);
        break;
      }
      case "routine-reset": {
        var rr = routineById(id);
        if (!rr) break;
        confirmDialog("Reset this routine?",
          "Today's habits in " + esc(rr.name) + " will be marked not done. This cannot be undone.",
          "Reset", function () {
            routineHabits(rr).forEach(function (h) { setHabitDone(h, false); });
            persist();
            render(false);
          });
        break;
      }
      case "new-routine":
        openRoutineDialog(null);
        break;
      case "edit-routine": {
        var re = routineById(id);
        if (!re) break;
        if (modalOpen) closeModal(function () { openRoutineDialog(re); });
        else openRoutineDialog(re);
        break;
      }
      case "routine-pick": {
        var pickInput = overlaySlot.querySelector("#routineNameInput");
        if (pickInput) pendingRoutine.name = pickInput.value;
        var hId = el.dataset.id;
        var at = pendingRoutine.habitIds.indexOf(hId);
        if (at === -1) pendingRoutine.habitIds.push(hId);
        else pendingRoutine.habitIds.splice(at, 1);
        refreshRoutineDialog();
        var pickBtn = overlaySlot.querySelector('[data-action="routine-pick"][data-id="' + hId + '"]');
        if (pickBtn) pickBtn.focus();
        break;
      }
      case "routine-save": {
        var routineNameInput = overlaySlot.querySelector("#routineNameInput");
        var routineName = routineNameInput ? routineNameInput.value.replace(/\s+/g, " ").trim() : "";
        if (routineName) pendingRoutine.name = routineName;
        if (!pendingRoutine.name.trim() || !pendingRoutine.habitIds.length) {
          if (routineNameInput && !routineNameInput.value.trim()) routineNameInput.focus();
          break;
        }
        if (pendingRoutine.id) {
          var existing = routineById(pendingRoutine.id);
          if (existing) {
            existing.name = pendingRoutine.name.trim();
            existing.habitIds = pendingRoutine.habitIds.slice();
          }
        } else {
          state.routines.push({
            id: "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
            name: pendingRoutine.name.trim(),
            habitIds: pendingRoutine.habitIds.slice()
          });
        }
        persist();
        closeModal(function () { render(false); });
        break;
      }
      case "kind-select": {
        var kind = el.dataset.kind;
        var kindInput = app.querySelector("#habitNameInput");
        if (kindInput) pendingHabit.name = kindInput.value;
        var autoIcon = !pendingHabit.icon || pendingHabit.icon === defaultIcon(pendingHabit.kind);
        pendingHabit.kind = kind;
        if (autoIcon) pendingHabit.icon = defaultIcon(kind);
        pendingHabit.target = kind === "count" ? 8 : kind === "timer" ? 30 : 1;
        refreshNewHabit('[data-action="kind-select"][data-kind="' + kind + '"]');
        break;
      }
      case "icon-select": {
        var iconName = el.dataset.iconName;
        var iconInput = app.querySelector("#habitNameInput");
        if (iconInput) pendingHabit.name = iconInput.value;
        pendingHabit.icon = iconName;
        refreshNewHabit('[data-action="icon-select"][data-icon-name="' + iconName + '"]');
        break;
      }
      case "target-inc":
      case "target-dec": {
        var nameEl2 = app.querySelector("#habitNameInput");
        if (nameEl2) pendingHabit.name = nameEl2.value;
        pendingHabit.target = Math.max(1, Math.min(240, pendingHabit.target + (action === "target-inc" ? 1 : -1)));
        refreshNewHabit('[data-action="' + action + '"]');
        break;
      }
      case "create-habit": {
        var nameEl3 = app.querySelector("#habitNameInput");
        if (nameEl3) pendingHabit.name = nameEl3.value;
        if (!pendingHabit.name.trim()) { if (nameEl3) nameEl3.focus(); break; }
        createHabit();
        break;
      }
      case "reminder-time":
        timeDialog();
        break;
      case "time-step": {
        if (!modalCtx) break;
        var unit = el.dataset.unit;
        var delta = parseInt(el.dataset.delta, 10);
        if (unit === "hour") modalCtx.hour = ((modalCtx.hour + delta) % 24 + 24) % 24;
        else modalCtx.minute = (modalCtx.minute + delta + 60) % 60;
        var hourEl = overlaySlot.querySelector("[data-time-hour]");
        var minEl2 = overlaySlot.querySelector("[data-time-minute]");
        if (hourEl) hourEl.textContent = String(modalCtx.hour).padStart(2, "0");
        if (minEl2) minEl2.textContent = String(modalCtx.minute).padStart(2, "0");
        break;
      }
      case "time-save":
        if (!modalCtx) break;
        state.reminderHour = modalCtx.hour;
        state.reminderMinute = modalCtx.minute;
        persist();
        closeModal(function () { render(false); });
        break;
      case "cycle-theme":
        state.themeMode = state.themeMode === "system" ? "light" : state.themeMode === "light" ? "dark" : "system";
        persist();
        resolveTheme();
        render(false);
        break;
      case "toggle-reminders":
        state.remindersOn = !state.remindersOn;
        persist();
        render(false);
        break;
      case "week-start":
        choiceDialog("Start week on", ["Monday", "Sunday"], state.weekStartsMonday ? "Monday" : "Sunday", function (value) {
          state.weekStartsMonday = value === "Monday";
          persist();
          render(false);
        });
        break;
      case "data-sheet":
        dataDialog();
        break;
      case "clear-all":
        closeModal(function () {
          confirmDialog("Clear habits & history?",
            "Habits, routines and their records are removed from this device. Your profile and settings stay. This cannot be undone.",
            "Clear all", function () {
              state.habits = [];
              state.routines = [];
              state.history = {};
              state.runningHabitId = null;
              state.timerStartedAt = null;
              state.timerBaseSeconds = 0;
              persist();
              stack = [{ name: "today" }];
              render(true);
            });
        });
        break;
      case "reset-app":
        closeModal(function () {
          confirmDialog("Reset the app?",
            "Habits, routines, history and your profile are removed, and setup starts again from the beginning. This cannot be undone.",
            "Reset app", function () {
              state = freshState();
              persist();
              resolveTheme();
              obReset();
              stack = [{ name: "onboarding" }];
              render(true);
            }, "danger");
        });
        break;
      case "about":
        infoDialog("Habit Tracker v1.0",
          "Local only. There is no account, no sync and no network. Your record stays on this device.");
        break;
      case "share-stats":
        openShareDialog();
        break;
      case "share-now":
        sharePoster();
        closeModal();
        break;
      case "edit-profile":
        editProfileDialog();
        break;
      case "profile-save": {
        var pInput = overlaySlot.querySelector("#profileNameInput");
        var pName = pInput ? pInput.value.replace(/\s+/g, " ").trim() : "";
        if (!pName) { if (pInput) pInput.focus(); break; }
        state.profile.name = pName;
        persist();
        closeModal(function () { render(false); });
        break;
      }
      case "pick-photo":
        photoTarget = el.dataset.target || "profile";
        photoInput.value = "";
        photoInput.click();
        break;
      case "remove-photo":
        photoTarget = el.dataset.target || "profile";
        applyPhoto("");
        break;
      case "ob-photo":
        photoTarget = "onboarding";
        photoInput.value = "";
        photoInput.click();
        break;
      case "ob-photo-remove":
        ob.photo = "";
        render(false);
        break;
      case "ob-next":
        if (ob.step === 0) {
          var obInput = app.querySelector("#obName");
          if (obInput) ob.name = obInput.value;
          if (!ob.name.trim()) { if (obInput) obInput.focus(); break; }
        }
        ob.step = Math.min(2, ob.step + 1);
        render(true);
        break;
      case "ob-back":
        ob.step = Math.max(0, ob.step - 1);
        render(true);
        break;
      case "ob-toggle": {
        var group = el.dataset.group;
        var key = el.dataset.key;
        if (!group || !key || !ob[group]) break;
        ob[group][key] = !ob[group][key];
        render(false);
        break;
      }
      case "ob-finish":
        finishOnboarding();
        break;
      case "modal-close":
        closeModal();
        break;
      case "modal-confirm": {
        var fn = modalCtx && modalCtx.onYes;
        closeModal(fn);
        break;
      }
      case "modal-save": {
        var input = overlaySlot.querySelector("#nameSheetInput");
        var value = input ? input.value.replace(/\s+/g, " ").trim() : "";
        if (!value) { if (input) input.focus(); break; }
        var saveFn = modalCtx && modalCtx.onSave;
        closeModal(function () { if (saveFn) saveFn(value); });
        break;
      }
      case "modal-choice": {
        var idx = parseInt(el.dataset.index, 10);
        var options = modalCtx && modalCtx.options;
        var pick = modalCtx && modalCtx.onPick;
        var chosen = options ? options[idx] : null;
        closeModal(function () { if (pick) pick(chosen); });
        break;
      }
    }
  });

  document.addEventListener("input", function (e) {
    if (!e.target) return;
    if (e.target.id === "habitNameInput") {
      pendingHabit.name = e.target.value;
      var createBtn = app.querySelector('[data-action="create-habit"]');
      if (createBtn) createBtn.disabled = e.target.value.trim() === "";
    } else if (e.target.id === "obName") {
      ob.name = e.target.value;
      var nextBtn = app.querySelector('[data-action="ob-next"]');
      if (nextBtn) nextBtn.disabled = e.target.value.trim() === "";
    } else if (e.target.id === "routineNameInput") {
      pendingRoutine.name = e.target.value;
      var routineSave = overlaySlot.querySelector('[data-action="routine-save"]');
      if (routineSave) routineSave.disabled = e.target.value.trim() === "" || !pendingRoutine.habitIds.length;
    } else if (e.target.id === "habitUnitInput") {
      pendingHabit.unit = e.target.value;
    }
  });

  /* ═══════════════ Clock and boot ═══════════════ */
  function updateClock() {
    var now = new Date();
    document.getElementById("statusTime").textContent =
      String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  }

  resolveTheme();
  paintIcons(document);
  updateClock();
  window.setInterval(updateClock, 30000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && rollover()) render(true);
  });
  window.addEventListener("resize", function () {
    if (activeAnchor) positionPopup();
  });
  phoneContent.addEventListener("scroll", function () {
    if (!activeAnchor) return;
    var view = phoneContent.getBoundingClientRect();
    var r = activeAnchor.getBoundingClientRect();
    if (r.bottom < view.top + 44 || r.top > view.bottom - 24) closeModal();
    else positionPopup();
  }, { passive: true });
  window.addEventListener("popstate", function () {
    if (suppressPop) { suppressPop = false; return; }
    historyDepth = Math.max(0, historyDepth - 1);
    if (modalOpen) { closeModal(null, true); return; }
    if (currentScreen().name === "onboarding") {
      if (ob.step > 0) { ob.step -= 1; render(true); }
      pushHistory();
      return;
    }
    if (stack.length > 1) { goBack(); pushHistory(); return; }
    pushHistory();
  });
  if (!state.profile.onboarded) pushHistory();
  render(true);
})();
</script>
</body>
</html>
