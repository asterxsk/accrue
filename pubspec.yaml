name: accrue
description: "Accrue: a calm, local habit tracker with check, timer and count habits, routines and insights."
publish_to: 'none'
version: 2.3.0+26

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_svg: ^2.0.10
  flutter_timezone: ^5.1.1
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  shared_preferences: ^2.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
